<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradients for the 3 books -->
    <linearGradient id="topBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="midBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="botBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Shadow for depth -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.4" flood-color="#020617"/>
    </filter>
  </defs>

  <!-- Dark premium background container to make details pop on dark and light tabs -->
  <rect width="128" height="128" rx="28" fill="#0f172a" />

  <g transform="translate(14, 16)" filter="url(#shadow)">
    <!-- Bottom Book (Blue) -->
    <g transform="rotate(-6, 50, 80)">
      <!-- Pages thickness -->
      <path d="M12 70h80v12H12z" fill="#f1f5f9" />
      <path d="M92 70c2 0 4 2 4 4v4c0 2-2 4-4 4" fill="#cbd5e1" />
      <!-- Cover -->
      <path d="M8 68h84a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-12a4 4 0 0 1 4-4z" fill="url(#botBook)" />
      <!-- Spine detail -->
      <rect x="4" y="70" width="8" height="12" rx="1" fill="#1e40af" opacity="0.6" />
    </g>

    <!-- Middle Book (Green) -->
    <g transform="rotate(4, 50, 50)">
      <!-- Pages thickness -->
      <path d="M16 42h80v12H16z" fill="#f8fafc" />
      <path d="M96 42c2 0 4 2 4 4v4c0 2-2 4-4 4" fill="#cbd5e1" />
      <!-- Cover -->
      <path d="M12 40h84a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4v-12a4 4 0 0 1 4-4z" fill="url(#midBook)" />
      <!-- Spine detail -->
      <rect x="8" y="42" width="8" height="12" rx="1" fill="#065f46" opacity="0.6" />
    </g>

    <!-- Top Book (Red) -->
    <g transform="rotate(-2, 50, 20)">
      <!-- Pages thickness -->
      <path d="M14 14h80v12H14z" fill="#ffffff" />
      <path d="M94 14c2 0 4 2 4 4v4c0 2-2 4-4 4" fill="#e2e8f0" />
      <!-- Cover -->
      <path d="M10 12h84a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z" fill="url(#topBook)" />
      <!-- Spine detail -->
      <rect x="6" y="14" width="8" height="12" rx="1" fill="#991b1b" opacity="0.6" />
      <!-- Bookmark ribbon hanging out of top book -->
      <path d="M76 28v22l-5-4-5 4V28" fill="#fbbf24" />
    </g>
  </g>
</svg>